name: Build Releases

on:
  push:
    branches: [dev]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v')
    name: Validate Release Ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const packageJson = require('./package.json')
          const tag = process.env.GITHUB_REF_NAME

          if (!/^\d+\.\d+\.\d+$/.test(packageJson.version)) {
            throw new Error(`Version tags require a stable package version: ${packageJson.version}`)
          }

          if (tag !== `v${packageJson.version}`) {
            throw new Error(`Tag ${tag} does not match package version ${packageJson.version}`)
          }

          console.log(`Validated release version ${packageJson.version}`)
          NODE

          comparison_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_REF_NAME}...main" --jq '.status')"

          if [ "$comparison_status" != "ahead" ] && [ "$comparison_status" != "identical" ]; then
            echo "Version tag ${GITHUB_REF_NAME} must point to a commit contained in main; comparison status is ${comparison_status}" >&2
            exit 1
          fi

          echo "Validated ${GITHUB_REF_NAME} as a tag on main"

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            build_command: yarn build:mac
            artifact_name: macos
            release_asset_prefix: league-akari-mac-arm64
            cache_path: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
            artifact_paths: |
              dist/*.dmg
              dist/*.zip
          - name: Windows
            os: windows-2022
            build_command: yarn build:win
            artifact_name: windows
            release_asset_prefix: league-akari-win-x64
            cache_path: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            artifact_paths: |
              dist/*.7z
              dist/*.exe
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Cache Electron Binaries
        uses: actions/cache@v6
        with:
          path: ${{ matrix.cache_path }}
          key: ${{ runner.os }}-electron-${{ hashFiles('yarn.lock', 'package.json', 'electron-builder.yml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Set CI package version
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const semver = require('semver')

          const packageJsonPath = 'package.json'
          const packageJson = JSON.parse(fs.readFileSync(packageJsonPath, 'utf8'))
          const sha = process.env.GITHUB_SHA

          if (!sha) {
            throw new Error('GITHUB_SHA is required')
          }

          packageJson.version = packageJson.version.includes('-')
            ? `${packageJson.version}.g${sha}`
            : `${packageJson.version}-ci.g${sha}`

          if (!semver.valid(packageJson.version)) {
            throw new Error(`Invalid CI package version: ${packageJson.version}`)
          }

          fs.writeFileSync(packageJsonPath, `${JSON.stringify(packageJson, null, 2)}\n`)
          fs.appendFileSync(process.env.GITHUB_ENV, `CI_PACKAGE_VERSION=${packageJson.version}\n`)
          console.log(`CI package version: ${packageJson.version}`)
          NODE

      - name: Build package
        run: ${{ matrix.build_command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize release asset names
        shell: bash
        env:
          RELEASE_ASSET_PREFIX: ${{ matrix.release_asset_prefix }}
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')

          const distDir = 'dist'
          const releaseAssetPrefix = process.env.RELEASE_ASSET_PREFIX

          if (!releaseAssetPrefix) {
            throw new Error('RELEASE_ASSET_PREFIX is required')
          }

          const packageExtensions = releaseAssetPrefix.includes('-win-')
            ? new Set(['.7z', '.exe'])
            : new Set(['.dmg', '.zip'])

          const filesByExtension = new Map()

          for (const name of fs.readdirSync(distDir)) {
            const filePath = path.join(distDir, name)

            if (!fs.statSync(filePath).isFile() || name.endsWith('.blockmap')) {
              continue
            }

            const extension = path.extname(name)

            if (!packageExtensions.has(extension)) {
              continue
            }

            if (filesByExtension.has(extension)) {
              throw new Error(`Multiple ${extension} artifacts found in ${distDir}`)
            }

            filesByExtension.set(extension, name)
          }

          if (!filesByExtension.size) {
            throw new Error(`No release artifacts found for ${releaseAssetPrefix}`)
          }

          for (const [extension, name] of filesByExtension) {
            const sourcePath = path.join(distDir, name)
            const targetName = `${releaseAssetPrefix}${extension}`
            const targetPath = path.join(distDir, targetName)

            fs.renameSync(sourcePath, targetPath)
            console.log(`${name} -> ${targetName}`)
          }
          NODE

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build]
    env:
      CI_RELEASE_BRANCH: dev
      CI_RELEASE_KEEP_COUNT: 3
      CI_RELEASE_TAG: ci-${{ github.sha }}
    steps:
      - name: Check release eligibility
        id: release_eligibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/${CI_RELEASE_BRANCH}" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Publishing official release ${GITHUB_REF_NAME} from main"
            exit 0
          fi

          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${CI_RELEASE_BRANCH}" --jq '.object.sha')"
          echo "current_sha=${current_sha}" >> "$GITHUB_OUTPUT"

          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping CI release for stale run ${GITHUB_SHA}; current ${CI_RELEASE_BRANCH} HEAD is ${current_sha}"
            exit 0
          fi

          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "Publishing CI release for current ${CI_RELEASE_BRANCH} HEAD ${GITHUB_SHA}"

      - name: Download build artifacts
        if: steps.release_eligibility.outputs.should_publish == 'true'
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts

      - name: List release artifacts
        if: steps.release_eligibility.outputs.should_publish == 'true'
        run: find release-artifacts -maxdepth 3 -type f -print | sort

      - name: Delete current CI release before retry
        if: github.ref == 'refs/heads/dev' && steps.release_eligibility.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "$CI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true

      - name: Prepare release metadata
        id: release_metadata
        if: steps.release_eligibility.outputs.should_publish == 'true'
        shell: bash
        run: |
          if [ "$GITHUB_REF" = "refs/heads/${CI_RELEASE_BRANCH}" ]; then
            short_sha="${GITHUB_SHA::7}"
            {
              echo "tag=${CI_RELEASE_TAG}"
              echo "name=League Akari Dev Prerelease #${GITHUB_RUN_NUMBER} (${short_sha})"
              echo "prerelease=true"
              echo "make_latest=false"
              echo "generate_notes=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag=${GITHUB_REF_NAME}"
              echo "name=League Akari ${GITHUB_REF_NAME}"
              echo "prerelease=false"
              echo "make_latest=true"
              echo "generate_notes=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to GitHub Release
        if: steps.release_eligibility.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_metadata.outputs.tag }}
          name: ${{ steps.release_metadata.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.release_metadata.outputs.prerelease }}
          make_latest: ${{ steps.release_metadata.outputs.make_latest }}
          generate_release_notes: ${{ steps.release_metadata.outputs.generate_notes }}
          overwrite_files: true
          files: release-artifacts/**/*
          fail_on_unmatched_files: true

      - name: Keep latest 3 CI prereleases
        if: always() && github.ref == 'refs/heads/dev' && steps.release_eligibility.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases-pages.json
          gh api "repos/${GITHUB_REPOSITORY}/commits?sha=${CI_RELEASE_BRANCH}&per_page=100" > branch-commits.json
          node <<'NODE'
          const childProcess = require('node:child_process')
          const fs = require('node:fs')

          const pages = JSON.parse(fs.readFileSync('releases-pages.json', 'utf8'))
          const branchCommits = JSON.parse(fs.readFileSync('branch-commits.json', 'utf8'))
          const keepCount = Number.parseInt(process.env.CI_RELEASE_KEEP_COUNT || '3', 10)

          if (!Number.isInteger(keepCount) || keepCount < 1) {
            throw new Error(`Invalid CI_RELEASE_KEEP_COUNT: ${process.env.CI_RELEASE_KEEP_COUNT}`)
          }

          const branchOrder = new Map(branchCommits.map((commit, index) => [commit.sha, index]))

          if (process.env.GITHUB_SHA && !branchOrder.has(process.env.GITHUB_SHA)) {
            branchOrder.set(process.env.GITHUB_SHA, -1)
          }

          const releases = pages
            .flat()
            .filter((release) => release.prerelease && release.tag_name.startsWith('ci-'))
            .map((release) => {
              const sha = release.tag_name.slice('ci-'.length)
              const branchIndex = branchOrder.has(sha) ? branchOrder.get(sha) : Number.POSITIVE_INFINITY
              return { release, sha, branchIndex }
            })
            .sort((a, b) => {
              if (a.branchIndex !== b.branchIndex) {
                return a.branchIndex - b.branchIndex
              }

              return (b.release.id || 0) - (a.release.id || 0)
            })

          const keptTags = new Set(
            releases.slice(0, keepCount).map(({ release }) => release.tag_name)
          )

          if (keptTags.size) {
            console.log(`Keeping CI prereleases: ${Array.from(keptTags).join(', ')}`)
          }

          for (const { release, branchIndex } of releases) {
            if (keptTags.has(release.tag_name)) {
              continue
            }

            const reason = Number.isFinite(branchIndex)
              ? `older than latest ${keepCount} CI prereleases on ${process.env.CI_RELEASE_BRANCH}`
              : `not found in latest ${branchCommits.length} commits on ${process.env.CI_RELEASE_BRANCH}`

            console.log(`Deleting CI prerelease ${release.tag_name}: ${reason}`)
            childProcess.execFileSync(
              'gh',
              [
                'release',
                'delete',
                release.tag_name,
                '--repo',
                process.env.GITHUB_REPOSITORY,
                '--cleanup-tag',
                '--yes'
              ],
              { stdio: 'inherit' }
            )
          }
          NODE
