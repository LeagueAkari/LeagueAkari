appId: sugar.cocoa.league-akari
productName: League Akari
directories:
  buildResources: build
files:
  - '**/*'
  - '!**/.vscode/*'
  - '!src{,/**}'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,README-en.md,FAQ.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.*.tsbuildinfo}'
  - '!{AGENTS.md,CLAUDE.md,PR_REQUIREMENTS.md}'
  - '!{.agents,.agents/**,.claude,.claude/**,.codex,.codex/**,.mcp.json,opencode.json}'
  - '!.playwright-mcp{,/**}'
  - '!.storybook{,/**}'
  - '!bench-results{,/**}'
  - '!examples'
  - '!docs'
  - '!pictures'
  - '!rabi-*'
  - '!feedback-platform{,/**}'
  - '!native{,/**}'
  - '!**/.venv/**'
  - '!node_modules/electron{,/**}'
  - '!node_modules/**/*.map'
  - '!node_modules/@electron-internal{,/**}'
  - '!node_modules/@electron/get{,/**}'
  - '!node_modules/better-sqlite3/{deps,src}{,/**}'
  - '!node_modules/better-sqlite3/{binding.gyp,*.gypi}'
  - '!node_modules/better-sqlite3/build/Release/{.forge-meta,obj}{,/**}'
  - '!node_modules/league-akari-native-win32{,/**}'
  - '!node_modules/regedit{,/**}'
  - '!resources/magic/*.node'
  - '!resources/akari-updater.exe'
  - '!resources/elevate.exe'
  - '!resources/rebuild_WMI.bat'
  - '!resources/regedit-vbs{,/**}'

electronLanguages:
  - zh-CN
  - zh-TW
  - en-US

afterPack: ./scripts/trim-packaged-app.cjs
afterSign: ./scripts/macos/ensure-codesign.cjs

asarUnpack:
  - resources/**
win:
  files:
    - from: resources
      to: resources
      filter:
        - akari-updater.exe
        - elevate.exe
        - rebuild_WMI.bat
        - regedit-vbs/**/*
    - from: resources/magic
      to: resources/magic
      filter:
        - magic.win32-x64.node
    - from: native/win32-x64
      to: node_modules/league-akari-native-win32
      filter:
        - package.json
        - dist/**/*
        - addons/*.node
    - from: node_modules/regedit
      to: node_modules/regedit
      filter:
        - '**/*'
  target:
    - 7z
  executableName: LeagueAkari
  icon: resources/LA_ICON.ico

mac:
  files:
    - from: resources/magic
      to: resources/magic
      filter:
        - magic.darwin-arm64.node
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  icon: build/icon.png
  protocols:
    - name: League Akari
      schemes:
        - league-akari
dmg:
  artifactName: ${name}-${version}.${ext}
asar: true
electronFuses:
  enableEmbeddedAsarIntegrityValidation: true

npmRebuild: false
publish:
#   provider: generic
#   url: https://league-akari.cocoa.sugar/releases
