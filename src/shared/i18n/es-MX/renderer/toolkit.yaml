toolkit:
  client:
    nativeSupport:
      unsupportedCurrentPlatform: No compatible con esta plataforma
      supportedButRequiresElevation: Compatible con esta plataforma, pero requiere privilegios de administrador
    leagueClient:
      title: Cliente de League
      disconnect:
        label: Desconectar
        description: Desconecta $t(common:appName) del cliente de League.
        button: Desconectar
      quitClient:
        label: Cerrar el proceso del cliente
        description: Cierra el cliente de League.
        button: Cerrar el proceso del cliente
        dialog:
          title: Cerrar el proceso del cliente
          content: ¿Seguro que quieres cerrar el proceso del cliente? Esto cerrará el juego directamente.
          positiveText: Cerrar
          negativeText: Cancelar
    gameClient:
      title: Cliente del juego
      windowsOnlyNativeAddon: Requiere complementos nativos (por ahora esta versión solo los incluye en Windows).
      nativeAddonRequiresAdministrator: Esta función es compatible con esta plataforma, pero requiere ejecutar como administrador.
      nativeAddonInitializationFailed: Falló el inicio de la entrada nativa, por lo que se desactivaron los atajos relacionados. Comprueba si algún software de seguridad bloqueó el componente y reinicia la aplicación.
      terminateGameClientWithShortcut:
        labelAdminRequired: Cerrar el cliente del juego con un atajo (requiere administrador)
        label: Activar el atajo para cerrar el cliente del juego
        description: Cuando el cliente del juego está abierto y en primer plano, el atajo puede forzar el cierre del proceso. Ten en cuenta que esto termina el proceso a la fuerza y no es una salida normal del juego, por lo que puede tener efectos inesperados.
      terminateShortcut:
        label: Atajo para cerrar
        labelAdminRequired: Atajo para cerrar (requiere administrador)
        description: Define un atajo personalizado para forzar el cierre del proceso del cliente del juego.
      settingsFileMode:
        label: Bloquear la configuración del juego
        description: Evita que los cambios dentro del juego sobrescriban la configuración que ya usas. Desbloquéala cuando necesites editarla.
        details:
          readonly: Al bloquearla, League Akari pone el archivo de configuración de League en solo lectura. El juego puede seguir leyendo tu configuración actual, pero los cambios nuevos no se guardarán encima.
          writable: Al desbloquearla se recupera el permiso de escritura, así que los gráficos, las teclas y otros cambios del juego se vuelven a guardar con normalidad.
          scope: Esto solo afecta al archivo de configuración de la instalación del cliente conectada.
        setToReadonly: Configuración del juego bloqueada
        setToWritable: Configuración del juego desbloqueada
        failedToSet: 'No se pudo cambiar el bloqueo de la configuración: {{reason}}'
    leagueClientUx:
      title: League Client UX
      fixWindowMethodAOptions:
        label: Ajustar el tamaño de la ventana
        labelAdminRequired: Ajustar el tamaño de la ventana (requiere administrador)
        description: <a target="_blank" href="https://github.com/LeagueTavern/fix-lcu-window">FixLCUWindow</a> - Ajusta el tamaño de la ventana con WinAPI. Puedes probarlo cuando el tamaño de la interfaz del cliente sea incorrecto.
        unsupportedCurrentPlatform: Ajustar el tamaño de la ventana no es compatible con esta plataforma.
        requiresAdministrator: Ajustar el tamaño de la ventana es compatible con esta plataforma, pero requiere ejecutar como administrador.
        button: Ajustar
        dialog:
          title: Ajustar el tamaño de la ventana
          content: ¿Quieres ajustar el tamaño de la ventana? Prueba esta opción si el cliente no se ve bien.
          positiveText: Ajustar
          negativeText: Cancelar
      restartUx:
        label: Reiniciar la interfaz del cliente
        description: Reinicia el proceso de renderizado al instante. No afecta a las actividades en curso y sirve para arreglar errores de la interfaz del cliente.
        button: Reiniciar el proceso UX
        dialog:
          title: Reiniciar el proceso UX
          content: ¿Quieres reiniciar el proceso UX? Prueba esta opción si el cliente no se ve bien.
          positiveText: Reiniciar
          negativeText: Cancelar
      killUx:
        label: Cerrar el proceso UX
        description: Termina el proceso de renderizado al instante. No afecta a las actividades en curso.
        button: Cerrar el proceso UX
        dialog:
          title: Cerrar el proceso UX
          content: ¿Seguro que quieres cerrar el proceso UX? Puede que tengas que volver a abrirlo. Cerrar el proceso UX no cierra el juego, pero puede reducir mucho el uso de recursos.
          positiveText: Cerrar
          negativeText: Cancelar
      launchUx:
        label: Abrir el proceso UX
        description: Abre el proceso de renderizado al instante si se había cerrado.
        button: Abrir el proceso UX
        dialog:
          title: Abrir el proceso UX
          content: ¿Quieres abrir el proceso UX?
          positiveText: Abrir
          negativeText: Cancelar
