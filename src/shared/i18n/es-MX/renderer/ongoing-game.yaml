    mapSemanticDescription: Los puntos son muestras de posición por minuto de los primeros 14 minutos. Las cruces son posiciones de participación en asesinatos dentro de los 14 minutos. Los puntos del minimapa pueden ser una muestra; usa el Peso por zona para ver los valores exactos.
    algorithmSummaryZoneWeight: El Peso por zona mide la intensidad de actividad en superior / central / inferior durante los primeros 14 minutos.
    algorithmSummaryPathing: El primer recorrido y los ganks tempranos se agregan dentro del alcance de muestra actual y se separan por lado azul / rojo.
