    algorithmDetails: Algoritmo
    algorithmDetailZoneWeight: '{zoneWeight} = Σ {positionWeight} + Σ {takedownWeight}. {positionWeight}: durante los {first14Minutes}, cada fotograma por minuto suma {pointOne} a la zona superior / central / inferior donde está el jungla. {takedownWeight}: cada participación en un asesinato dentro de los 14 minutos suma {pointFive} a la zona donde ocurrió.'
    algorithmDetailPreference: '{preferenceDecision}: si central + inferior suman ≥ 70% y superior ≤ 28%, es {midBot}. Si superior + central suman ≥ 70% e inferior ≤ 28%, es {topMid}. Si una {singleZone} tiene ≥ 40% y al menos 8 puntos porcentuales más que la segunda, es Superior / Central / Inferior. Si no, es {balanced}.'
    algorithmDetailFirstClear: '{firstClearDecision}: se usa el campamento de jungla más cercano a la {oneMinutePosition}. Si el campamento está en la mitad enemiga, cuenta como {invadeStart}.'
    algorithmDetailLevel3Gank: '{level3Decision}: en el {threeMinuteFrame}, los súbditos (súbditos + jungla) están en {csRange}, el nivel es {level3} y se detecta {championDamage}. Sin datos detallados de daño, se usa la {takedownParticipation} dentro de los 3 minutos como condición de daño.'
    algorithmDetailLevel4Gank: '{level4Decision}: hasta el {fourMinuteFrame}, se detecta un {championDamageIncrease} respecto al minuto 3, o hubo {takedownParticipation} entre los minutos 3 y 4. Sin datos detallados de daño, solo se usa la {takedownParticipation}.'
    algorithmDetailAggregation: '{aggregation}: la pestaña activa define el {sampleScope} (campeón actual o todos). El primer recorrido y los ganks tempranos se acumulan por separado para el {blueRedSide}.'
