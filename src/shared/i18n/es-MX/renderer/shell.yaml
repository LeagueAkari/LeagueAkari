    newContent: |
      <div class="akari-disclaimer">

      <style>
      .akari-disclaimer{
        background-color:#ffffff;
        color:#333333;
        line-height:1.65;
        padding:1.75rem 2rem;
        box-shadow:0 2px 6px rgba(0,0,0,.15);
      }
