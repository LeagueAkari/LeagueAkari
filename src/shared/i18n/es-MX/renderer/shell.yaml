      .akari-disclaimer h2{
        color:#d97706;
        margin-top:1.5rem;
        margin-bottom:.75rem;
        line-height:1.25;
      }
      .akari-disclaimer h1{font-size:1.6rem;}
      .akari-disclaimer h2{font-size:1.25rem;}
      .akari-disclaimer ul{margin-left:1.5rem;}
      .akari-disclaimer li{margin-bottom:.65rem;}
      .akari-disclaimer a{color:#2563eb;text-decoration:none;}
      .akari-disclaimer a:hover{text-decoration:underline;}
      [data-theme='dark'] .akari-disclaimer{
        background-color:#1e1e1e;
        color:#e6e6e6;
        box-shadow:0 2px 6px rgba(0,0,0,.35);
      }
      [data-theme='dark'] .akari-disclaimer h1,
      [data-theme='dark'] .akari-disclaimer h2{
        color:#ffd866;
      }
      [data-theme='dark'] .akari-disclaimer a{
        color:#8ab4f8;
      }
      </style>

      # Guía de uso y aviso legal de $t(common:appName)

      > **Antes de descargar, instalar o usar este software, lee y comprende por completo esta guía y aviso legal.**
      > Al empezar a usarlo, se considera que entendiste y aceptaste todos los términos siguientes.

      ---

      ## I. Naturaleza del software y forma de obtenerlo
      - **$t(common:appName)** es totalmente de código abierto y gratuito; todas sus funciones se ofrecen "tal cual".
      - Este software no se vende de ninguna forma: ni de pago, ni incluido en paquetes, ni con fines de lucro. Si encuentras cualquier forma de reventa, paquete u otra actividad con fines de lucro, no lo compres. Si ya lo compraste, **solicita el reembolso de inmediato**.

      ## II. Aviso de riesgos y limitación de responsabilidad
      - Usar este software **puede** provocar, entre otras cosas:
        1. La suspensión temporal o permanente de tu cuenta de juego;
        2. La pérdida, corrupción o falta de coincidencia de los datos del juego con los del servidor;
        3. Cierres inesperados del cliente, pérdida de rendimiento u otras malas experiencias de juego.
      - El equipo de desarrollo de **$t(common:appName)** y todos sus colaboradores no asumen ninguna responsabilidad por daños directos, indirectos, incidentales, especiales o consecuentes derivados del uso o de la imposibilidad de usar este software; todos los riesgos corren por cuenta del usuario.

      > Consulta la sección **Mejoras en el seguimiento de información del juego** de las [Notas de la versión 25.17](https://www.leagueoflegends.com/es-mx/news/game-updates/patch-25-17-notes/).

      ## III. Compatibilidad con servidores
      - **A partir de la publicación de este aviso, $t(common:appName) deja de ofrecer cualquier tipo de soporte para los servidores de Tencent Games.**
      - Usar este software en servidores de Tencent tiene muchas probabilidades de infringir los acuerdos de usuario, las normas de gestión o las medidas de protección técnica de Tencent Games; cualquier suspensión de cuenta, pérdida de datos u otra consecuencia negativa es responsabilidad exclusiva del usuario.

      ## IV. Recopilación de información y privacidad
      - Para mejorar la calidad del producto, analizar errores y elaborar estadísticas de seguridad, el software recopila durante su funcionamiento información del sistema y registros de errores **necesarios y limitados**.
      - La información recopilada **no** contiene datos de identificación personal, no se sube a ningún servidor de terceros y no se usa con fines comerciales.

      ## V. Otros
      - Si pulsas el botón de confirmar tres veces seguidas, esta ventana se cierra rápidamente. Al hacerlo, se considera que leíste y aceptaste esta guía y aviso legal.

      ---

      > **Si tienes alguna duda sobre esta guía y aviso legal, o necesitas más información sobre el software, visita**
      > <https://github.com/LeagueAkari/LeagueAkari> .

