      downloadRelease: Descargar versión
      newRelease: Versión nueva
      cancelUpdate: Cancelar actualización
      restartNow: Reiniciar ahora
      updateProgress:
        label: Progreso de la actualización
        description: La actualización en curso
        downloading: Descargando el paquete de actualización
        finished: Completado {{progress}}%
        remain: Quedan {{time}}
        downloadFailed: Error en la descarga
        waitingForRestart: Esperando el reinicio
        waitingForRestartDescription: La actualización automática se realizará después de cerrar la aplicación
      checkUpdatesResult:
        no-updates: No hay versiones nuevas
        new-updates: Hay una versión nueva disponible
        failed: Error al buscar actualizaciones {{reason}}
