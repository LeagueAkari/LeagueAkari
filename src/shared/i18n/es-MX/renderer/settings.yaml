      autoCheckUpdates:
        label: Buscar actualizaciones automáticamente
        description: Comprueba periódicamente si hay versiones nuevas
      autoDownloadUpdates:
        label: Descargar actualizaciones automáticamente
        description: Inicia la actualización automáticamente cuando se detecta una versión nueva
