        enableText: Activar la aceleración por hardware
        disableText: Desactivar la aceleración por hardware
        disableConfirmation: Se desactivará la aceleración por hardware; reinicia la aplicación para aplicar el cambio
        enableConfirmation: Se activará la aceleración por hardware; reinicia la aplicación para aplicar el cambio
        positiveText: Reiniciar y salir
        negativeText: Cancelar
      uninstallApp:
        label: Desinstalar la aplicación
        description: Desinstala la aplicación, lo que borrará todos los datos y la configuración
        button: Desinstalar la aplicación
        title: Desinstalar la aplicación
        content: ¿Seguro que quieres desinstalar $t(common:appName)? También se borrarán todos los datos de la aplicación.
        positiveText: Desinstalar
        negativeText: Cancelar
  matchHistory:
    title: Pestañas del historial
    refreshTabsAfterGameEnds:
      label: Actualizar las pestañas al terminar la partida
      description: Actualiza automáticamente las pestañas del historial cuando termina la partida. Por el retraso del servidor remoto, puede que no se actualicen a tiempo
    loadCount:
      label: Partidas a cargar
      description: Número de partidas que se cargan en cada pestaña del historial.
    showJunglePathing:
      label: Activar las rutas de jungla
      description: Muestra el acceso y la tarjeta de análisis de rutas de jungla en las páginas del historial.
  ongoingGame:
    title: Partida en curso
    titleCommon: Partida en curso
    titlePlayerCard: Tarjeta de jugador
    enabled:
      label: Activar
      description: Analiza la partida al entrar en la selección de campeones o durante la partida.
    autoRouteWhenGameStarts:
      label: Ir a la partida en curso automáticamente
      description: Cambia automáticamente a la página de partida en curso al entrar en la selección de campeones o al empezar la partida. No se aplica en la sala.
    matchHistoryLoadCount:
      label: Partidas del historial a cargar
      description: Número de partidas que se consultan para analizar el desempeño de cada jugador en la página de la partida.
    concurrency:
      label: Límite de peticiones simultáneas
      description: Limita el total de peticiones de red simultáneas durante el análisis de la partida. No afecta a los límites de otros módulos.
    matchHistoryTagPreference:
      label: Filtro de cola preferido
      description: Filtro de cola preferido al cargar el historial con la API SGP.
      options:
        all: Todos los modos
        current: Modo actual
    queryInLobbyPhase:
      label: Consultar en la sala
      description: Además de en la selección de campeones y durante la partida, también puedes ver los datos de todos los miembros de la sala.
    premadeTeamInferMatchCountThreshold:
      label: Partidas mínimas para detectar premades
      description: Número mínimo de partidas juntos para confirmar que son un grupo premade.
    gameDetailsLoadCount:
      label: Detalles de partidas a cargar
      description_one: Se cargará además la información detallada de la primera {{count}} partida para el análisis.
      description_other: Se cargará además la información detallada de las primeras {{count}} partidas para el análisis.
    jungleAnalysisMatchHistoryLoadCount:
      label: Partidas del historial para el análisis de jungla
      description_one: El análisis de jungla puede seguir consultando el historial hasta la primera {{count}} partida para reunir 20 muestras de jungla del campeón actual y 50 en total.
      description_other: El análisis de jungla puede seguir consultando el historial hasta las primeras {{count}} partidas para reunir 20 muestras de jungla del campeón actual y 50 en total.
    showRecentlyUsedChampions:
      label: Mostrar campeones usados recientemente
      description: Muestra los campeones usados recientemente en la tarjeta del jugador.
    showChampionUsage:
      label: Mostrar uso de campeones
      description: Muestra el uso de campeones en la tarjeta del jugador.
      options:
        none: Nada
        recent: Usados recientemente
        mastery: Nivel de maestría
    showJunglePathing:
      label: Activar las rutas de jungla
      description: Muestra el análisis de rutas de jungla en las tarjetas de jugador de la partida en curso.
    showMatchHistoryItemBorder:
      label: Mostrar el borde de cada partida
      description: Muestra un borde alrededor de cada partida del historial.
    playerCardTags:
      label: Etiquetas de la tarjeta de jugador
      description: Estas etiquetas se mostrarán en las tarjetas de jugador
      tags:
