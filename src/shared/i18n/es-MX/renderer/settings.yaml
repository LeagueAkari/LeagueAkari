    mainWindowUi:
      title: Interfaz de la ventana principal
      background:
        label: Fondo
        description: Elige el modo de fondo de la ventana principal
        options:
          profileSkin: Fondo de campeón
          customImage: Fondo personalizado
          none: Predeterminado
          system: Material del sistema
        tooltips:
          profileSkin: Usa el aspecto de fondo del perfil del jugador actual como fondo de la ventana principal
          system: Usa Mica en Windows y el desenfoque nativo de la ventana en macOS. Si no está disponible o falla, vuelve al fondo sólido predeterminado
      customBackground:
        label: Fondo personalizado
        description: Usa una imagen o un video local como fondo fijo. El fondo se recorta desde el centro
        filePath: Ruta del archivo
        filePlaceholder: Ningún archivo de fondo seleccionado
        browse: Examinar
        overlayStrength: Intensidad de la capa
      backgroundMaterial:
        label: Material del fondo
        description: Elige el material del fondo de la interfaz; requiere una versión del sistema compatible
        options:
          none: Ninguno
          system: Material del sistema
          systemUnsupported: Material del sistema (no compatible)
    lcConnection:
      title: Conexión con LCU
      autoConnect:
        label: Conectar automáticamente
        description: Se conecta automáticamente al cliente cuando solo hay uno abierto
      useWmi:
        label: Usar WMIC
        description: Usa WMIC para obtener la línea de comandos del cliente en lugar del método predeterminado de la API de Win32. Requiere privilegios de administrador
      rebuildWmi:
        label: Reconstruir WMI
        description: Si WMIC no funciona bien, prueba esto
        rebuildButton: Reconstruir WMI
    httpProxy:
      title: Proxy de red
      strategy:
        label: Proxy HTTP
        description: Configura el proxy de las peticiones de red de toda la aplicación, incluidos datos, imágenes y descargas de actualizaciones. Las conexiones locales con el cliente no se ven afectadas
        options:
          fixed-servers: Proxy manual
          system: Seguir al sistema
          direct: Desactivado
      host:
        label: Host del proxy
        description: El host del servidor proxy
      port:
        label: Puerto del proxy
        description: El puerto del servidor proxy
    misc:
      title: Varios
      logLevel:
        label: Nivel de registro
        description: Elige el nivel de registro de la aplicación
      disableHardwareAcceleration:
        label: Desactivar la aceleración por hardware
        description: Desactiva la aceleración por hardware, lo que puede solucionar algunos problemas de renderizado, como el texto borroso
