          sgp:
            title: API SGP
            feature1: Consultas rápidas con respuesta ágil
            feature2: Ofrece datos de partidas más detallados
            feature3: Permite consultar historiales de otras regiones en los servidores de China continental
            warning: Si usas una VPN o un acelerador para jugar en servidores extranjeros, la conexión puede fallar o ser muy lenta
          lcu:
            title: API LCU (local del cliente)
            feature1: Muy estable, no depende de la red
            feature2: Fiable aunque uses una VPN o un acelerador
