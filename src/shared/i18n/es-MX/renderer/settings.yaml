          label: Texto de grupo premade
        showWinningStreakTag:
          label: Racha de victorias
        showLosingStreakTag:
          label: Racha de derrotas
        showSoloKillsTag:
          label: Asesinatos en solitario promedio por partida
        showEasyGankTag:
          label: Etiqueta de fácil/difícil de gankear
        showAverageTeamDamageTag:
          label: Porcentaje de daño del equipo promedio
        showAverageTeamDamageTakenTag:
          label: Porcentaje de daño recibido del equipo promedio
        showSuspiciousFlashPositionTag:
          label: Detección de tecla de Destello inusual
        showAverageTeamGoldTag:
          label: Porcentaje de oro del equipo promedio
        showAverageCsPerMinuteTag:
          label: Súbditos por minuto promedio
        showGreatPerformanceTag:
          label: Etiqueta de desempeño destacado
        showMetTag:
          label: Jugadores con los que ya coincidiste
        showTaggedTag:
          label: Jugadores marcados
        showSelfTag:
          label: Etiqueta propia
        showWinRateTeamTag:
          label: Etiqueta de tasa de victorias alta
        showAverageDamageGoldEfficiencyTag:
          label: Etiqueta de eficiencia daño-oro
        showPrivacyTag:
          label: Etiqueta de perfil oculto
        showAverageEnemyMissingPingsTag:
          label: Pings de enemigo desaparecido promedio
        showAverageVisionScoreTag:
          label: Puntuación de visión promedio
        showAkariScoreTag:
          label: Puntuación Akari
        showAverageKillDamageEfficiencyTag:
          label: Eficiencia asesinatos-daño promedio
  multiWindow:
    title: Multiventana
    auxWindow:
      title: Ventana auxiliar
      enabled:
        label: Activar la ventana auxiliar
        description: Usa una ventana pequeña en ciertas fases de la partida para mostrar el estado y ofrecer acciones adicionales.
        descriptionWithIcon: Se puede abrir con el icono rápido a la derecha de la barra de título ({icon}) o con clic derecho en el icono de la bandeja y eligiendo "Ventana auxiliar").
      autoShow:
        label: Mostrar y cerrar automáticamente
        description: Muestra o cierra automáticamente la ventana auxiliar en ciertas fases de la partida.
      opacity:
        label: Opacidad de la ventana
        description: Ajusta la transparencia de la ventana auxiliar.
      resetWindowPosition:
        label: Restablecer la posición de la ventana
        description: Devuelve la ventana auxiliar a su posición predeterminada en el centro de la pantalla principal.
        button: Restablecer
    opggWindow:
      title: Ventana de datos de campeones
      enabled:
        label: Activar los datos de campeones
        description: Consulta datos de campeones de OP.GG o 101 (CN)
        descriptionWithIcon: Ábrela con el icono rápido a la derecha de la barra de título ({icon}) o desde "Ventana de datos de campeones" en el menú de la bandeja.
      autoShow:
        label: Mostrar y cerrar automáticamente
        description: Muestra o cierra automáticamente la ventana de datos de campeones en ciertas fases de la partida.
      opacity:
        label: Opacidad de la ventana
        description: Ajusta la transparencia de la ventana de datos de campeones.
      resetWindowPosition:
        label: Restablecer la posición de la ventana
        description: Devuelve la ventana de datos de campeones a su posición predeterminada en el centro de la pantalla principal.
        button: Restablecer
      showShortcut:
        label: Atajo para mostrar
        description: Usa el atajo de teclado para mostrar u ocultar la ventana de datos de campeones. Si el juego está en primer plano, se fijará automáticamente. Asegúrate de que el juego esté en modo sin bordes o en ventana para que se vea correctamente.
      showSkinSelector:
        label: Selector de aspectos
        description: Muestra la selección rápida de aspectos en el asistente de selección de campeones.
    ongoingGameWindow:
      title: Ventana superpuesta de la partida en curso
      titleRequireAdmin: Ventana superpuesta de la partida en curso (requiere administrador)
      enabled:
        label: Activar la ventana de la partida en curso
        description: Muestra una ventana superpuesta durante la partida con información de la partida en curso. Requiere que el cliente del juego esté en modo ventana o sin bordes.
      showShortcut:
        label: Atajo para mostrar
        description: Mantén pulsado el atajo para mostrar la ventana superpuesta durante la partida
    cdTimerWindow:
      title: Ventana superpuesta de temporizadores
      titleRequireAdmin: Ventana superpuesta de temporizadores (requiere administrador)
      description:
        lineA: Los temporizadores de hechizos de invocador enemigos solo están disponibles en los modos compatibles
        leftClick1: Clic izquierdo
        leftClick2: Inicia o detiene este temporizador
        rightDoubleClick1: Doble clic derecho
        rightDoubleClick2: Envía al chat de la partida un temporizador de hechizo ya iniciado
        wheel1: Rueda
        wheel2: Ajusta el tiempo de un temporizador ya iniciado
      enabled:
        label: Activar la ventana de temporizadores
        description: Muestra una ventana superpuesta durante la partida con temporizadores. Requiere que el cliente del juego esté en modo ventana o sin bordes.
      showShortcut:
        label: Atajo para mostrar
        description: Usa el atajo de teclado para mostrar u ocultar la ventana superpuesta
      resetWindowPosition:
        label: Restablecer la posición de la ventana
        description: Devuelve la ventana de temporizadores al centro de la pantalla principal.
        button: Restablecer
      timerType:
        label: Tipo de temporizador
        description: Elige el tipo de temporizador. La cuenta regresiva usa el tiempo predefinido de los hechizos de invocador (puede tener errores), mientras que el cronómetro empieza desde 0. Los temporizadores personalizados siempre usan el cronómetro.
        options:
          countdown: Cuenta regresiva
          countup: Cronómetro
      reverseAdjustmentDirection:
        label: Invertir la dirección del ajuste
        description: Invierte la dirección del ajuste del temporizador. Al subir la rueda el tiempo disminuye, y al bajarla aumenta. Solo se aplica cuando el tipo de temporizador es Cronómetro.
  misc:
